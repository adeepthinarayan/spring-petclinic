
name: Spring PetClinic CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # CI - CONTINUOUS INTEGRATION
  # ==========================================
  ci:
    name: CI - Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT SOURCE CODE
      # ==========================================
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ==========================================
      # SET UP JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================================
      # BUILD AND TEST APPLICATION
      # ==========================================
      - name: Build and Test Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -Dtest='!*IntegrationTests'

      # ==========================================
      # SET UP JAVA 21 FOR SONAR SCANNER
      # ==========================================
      - name: Set up Java 21 for SonarQube
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # SONARQUBE CLOUD ANALYSIS
      # ==========================================
      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io

      # ==========================================
      # BUILD DOCKER IMAGE
      # ==========================================
      - name: Build Docker Image
        run: |
          docker build -t spring-petclinic:${{ github.sha }} .

      # ==========================================
      # TRIVY CONTAINER VULNERABILITY SCAN
      # TEMPORARILY DISABLED
      # ==========================================
      #
       - name: Scan Docker Image with Trivy
         uses: aquasecurity/trivy-action@v0.36.0
         with:
           image-ref: spring-petclinic:${{ github.sha }}
           format: table
           exit-code: '1'
           ignore-unfixed: true
           vuln-type: os,library
           severity: HIGH,CRITICAL

      # ==========================================
      # VALIDATE DOCKER HUB CREDENTIALS
      # ==========================================
      - name: Validate Docker Hub Credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Docker Hub username is missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub token is missing."
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      # ==========================================
      # LOGIN TO DOCKER HUB
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # TAG AND PUSH DOCKER IMAGE
      # ==========================================
      - name: Push Docker Image to Docker Hub
        run: |
          docker tag spring-petclinic:${{ github.sha }} \
            ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

          docker tag spring-petclinic:${{ github.sha }} \
            ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:latest

          docker push ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

          docker push ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:latest

      # ==========================================
      # CI SUMMARY
      # ==========================================
      - name: CI Summary
        run: |
          echo "## CI Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maven build and unit tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- SonarQube Cloud analysis submitted." >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image built successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy scan temporarily disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image pushed to Docker Hub." >> "$GITHUB_STEP_SUMMARY"


  # ==========================================
  # CD - CONTINUOUS DEPLOYMENT
  # ==========================================
  cd:
    name: CD - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: ci

    steps:

      # ==========================================
      # CHECKOUT SOURCE CODE
      # ==========================================
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # ==========================================
      # INSTALL K3S
      # ==========================================
      - name: Install K3s
        run: |
          curl -sfL https://get.k3s.io | sh -

          until sudo k3s kubectl get nodes >/dev/null 2>&1; do
            echo "Waiting for K3s to start..."
            sleep 5
          done

          sudo k3s kubectl wait \
            --for=condition=Ready nodes \
            --all \
            --timeout=180s

      # ==========================================
      # DEPLOY APPLICATION TO KUBERNETES
      # ==========================================
      - name: Deploy Spring PetClinic
        run: |
          sudo k3s kubectl apply -f k8s/deployment.yaml

          sudo k3s kubectl set image deployment/spring-petclinic \
            spring-petclinic=${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

          sudo k3s kubectl apply -f k8s/service.yaml

      # ==========================================
      # VERIFY KUBERNETES DEPLOYMENT
      # ==========================================
      - name: Verify Kubernetes Deployment
        run: |
          sudo k3s kubectl rollout status deployment/spring-petclinic \
            --timeout=180s

          echo "===== NODES ====="
          sudo k3s kubectl get nodes

          echo "===== DEPLOYMENTS ====="
          sudo k3s kubectl get deployments

          echo "===== PODS ====="
          sudo k3s kubectl get pods

          echo "===== SERVICES ====="
          sudo k3s kubectl get services

      # ==========================================
      # VERIFY APPLICATION
      # ==========================================
      - name: Verify Application
        run: |
          SERVICE_PORT=$(sudo k3s kubectl get service spring-petclinic-service \
            -o jsonpath='{.spec.ports[0].port}')

          echo "Service port: $SERVICE_PORT"

          sudo k3s kubectl port-forward \
            service/spring-petclinic-service \
            8080:${SERVICE_PORT} \
            --address 127.0.0.1 \
            >/tmp/port-forward.log 2>&1 &

          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Spring PetClinic is responding successfully."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Application verification failed."
          cat /tmp/port-forward.log
          exit 1

      # ==========================================
      # INSTALL CLOUDFLARED
      # ==========================================
      - name: Install Cloudflare Tunnel
        run: |
          curl -L --fail --show-error \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # ==========================================
      # START CLOUDFLARE TUNNEL
      # ==========================================
      - name: Start Cloudflare Tunnel
        run: |
          SERVICE_PORT=$(sudo k3s kubectl get service spring-petclinic-service \
            -o jsonpath='{.spec.ports[0].port}')

          nohup sudo k3s kubectl port-forward \
            service/spring-petclinic-service \
            8080:${SERVICE_PORT} \
            --address 127.0.0.1 \
            >/tmp/cloudflare-port-forward.log 2>&1 </dev/null &

          echo "Waiting for Kubernetes port-forward..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              break
            fi

            sleep 2
          done

          if ! curl -fsS http://localhost:8080/ >/dev/null; then
            echo "Kubernetes port-forward failed."
            cat /tmp/cloudflare-port-forward.log
            exit 1
          fi

          nohup cloudflared tunnel \
            --url http://localhost:8080 \
            --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 </dev/null &

          echo "Waiting for Cloudflare Tunnel URL..."

          for i in {1..30}; do
            PUBLIC_URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflare Tunnel URL was not generated."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

          echo "## Public Application URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # VERIFY PUBLIC APPLICATION ACCESS
      # ==========================================
      - name: Verify Public Application Access
        run: |
          echo "Testing public URL: $PUBLIC_URL"

          for i in {1..12}; do
            if curl -fsS "$PUBLIC_URL/" >/dev/null; then
              echo "Public application is accessible."
              exit 0
            fi

            echo "Waiting for public application..."
            sleep 5
          done

          echo "Public application verification failed."
          cat /tmp/cloudflared.log
          exit 1

      # ==========================================
      # KEEP APPLICATION AVAILABLE
      # ==========================================
      - name: Keep Application Available for 2 Minutes
        run: |
          echo "Application is available at:"
          echo "$PUBLIC_URL"

          sleep 120

      # ==========================================
      # CD SUMMARY
      # ==========================================
      - name: CD Summary
        if: always()
        run: |
          echo "## CD Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kubernetes deployment: spring-petclinic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kubernetes service: spring-petclinic-service" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image: ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment environment: K3s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public access: Cloudflare Quick Tunnel" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${PUBLIC_URL:-}" ]; then
            echo "- Public URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
