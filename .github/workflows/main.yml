name: Spring PetClinic CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==========================================
  # CI - CONTINUOUS INTEGRATION
  # ==========================================
  ci:
    name: CI - Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Run Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw clean package -Dtest='!*IntegrationTests'

      - name: Build Docker Image
        run: |
          docker build \
            -t spring-petclinic:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker tag spring-petclinic:${{ github.sha }} \
            ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

          docker tag spring-petclinic:${{ github.sha }} \
            ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:latest

          docker push ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:${{ github.sha }}

          docker push ${{ vars.DOCKERHUB_USERNAME }}/spring-petclinic:latest
